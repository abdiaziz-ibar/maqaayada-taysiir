name: Deploy to idraakict

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /var/www/html/maqaayada-taysiir
            git pull origin main

            cd backend
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            pm2 restart maqaayda-taysiir-backend || pm2 start ecosystem.config.js
            pm2 save

            cd ../frontend
            npm ci
            npm run build

# Nginx site config for Maqaayda Taysiir (Taysiir International Schools KM13).
# Serves the built React frontend as static files and reverse-proxies
# /api/* to the Node backend running under PM2 on port 5050.
#
# One-time setup on the server:
#   sudo cp deploy/nginx/maqaayda.idraakict.com.conf /etc/nginx/sites-available/maqaayda.idraakict.com
#   sudo ln -s /etc/nginx/sites-available/maqaayda.idraakict.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d maqaayda.idraakict.com   # adds the HTTPS server block automatically

server {
    listen 80;
    server_name maqaayda.idraakict.com;

    root /var/www/html/maqaayada-taysiir/frontend/dist;
    index index.html;

    # Hashed JS/CSS/images from the Vite build can be cached aggressively.
    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: any non-file path falls back to index.html.
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
